# application.properties - VERSIÓN CON DATABASE_URL

# ==================== DATABASE (Usar DATABASE_URL de Railway) ====================
# Railway provee DATABASE_URL que ya incluye todo
spring.datasource.url=${DATABASE_URL}?sslmode=require

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==================== SERVER ====================
server.port=${PORT:8080}
server.servlet.context-path=/

# ==================== THYMELEAF ====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true

# ==================== CONNECTION POOL ====================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.uns.siiga2.__web=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# ==================== DESACTIVA SESSION JDBC TEMPORALMENTE ====================
spring.session.jdbc.initialize-schema=never