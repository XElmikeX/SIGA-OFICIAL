# Configuración para Railway - USAR DIRECTAMENTE DATABASE_URL
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:bhGIayJJktrswKVCbxzjGbiPlHhgajtQ}

# O SI DATABASE_URL YA INCLUYE USUARIO/CONTRASEÑA, puedes usar:
# spring.datasource.url=${DATABASE_URL}

# Configuración Spring
spring.application.name=siiga2.0-web
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server - IMPORTANTE para Railway
server.port=${PORT:8080}
server.address=0.0.0.0

# Opcional: SSL para Railway
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10