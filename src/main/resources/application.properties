# application.properties - VERSIÓN CORREGIDA PARA RAILWAY

# ==================== DATABASE ====================
# Railway da estas variables automáticamente
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==================== SERVER ====================
server.port=${PORT:8080}
server.servlet.context-path=/

# ==================== THYMELEAF ====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true

# ==================== CONNECTION POOL ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1800000

# ==================== LOGGING ====================
# DEBUG solo en desarrollo
logging.level.root=INFO
logging.level.com.uns.siiga2.__web=INFO

# ==================== DESACTIVA SESSION JDBC ====================
spring.session.jdbc.initialize-schema=never

# ==================== TIMEZONE ====================
spring.jpa.properties.hibernate.jdbc.time_zone=UTC