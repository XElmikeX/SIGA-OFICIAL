# application.properties - VERSIÓN CORREGIDA PARA RAILWAY

# ==================== DATABASE (Railway PostgreSQL) ====================
# Railway automáticamente inyecta estas variables:
# PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==================== SERVER ====================
# Railway asigna un puerto dinámico, usamos la variable PORT
server.port=${PORT:8080}
server.servlet.context-path=/

# ==================== THYMELEAF ====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true

# ==================== CONNECTION POOL ====================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.uns.siiga2.__web=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==================== SECURITY (Temporal) ====================
# Deshabilitar seguridad para desarrollo
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always