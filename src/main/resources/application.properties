# application.properties - VERSIÓN CORREGIDA PARA RAILWAY

# ==================== DATABASE (Corrige DATABASE_URL) ====================
# Railway da DATABASE_URL como: postgresql://user:pass@host:port/db
# Spring necesita: jdbc:postgresql://host:port/db
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==================== SERVER ====================
server.port=${PORT:8080}
server.servlet.context-path=/

# ==================== THYMELEAF ====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true

# ==================== CONNECTION POOL ====================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.uns.siiga2.__web=DEBUG

# ==================== DESACTIVA SESSION JDBC ====================
spring.session.jdbc.initialize-schema=never