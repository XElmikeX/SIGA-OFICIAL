<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profesor</title>
    <link rel="stylesheet" th:href="@{/info/css-docente/tabla.css}">
    <link rel="icon" th:href="@{/G-assets/imagenes/logo.png}">
</head>
<body>
    <div class="fondo">
        <h1>Profesor: <span th:text="${nombreDocente}"></span></h1>
        
        <div class="div">
            <h2>Mis Cursos:</h2>
        </div>
        
        <ul class="message">
            <li th:each="curso : ${listaCursos}">
                <a class="lista" th:href="@{/profesor/curso/{id}(id=${curso.id})}" 
                th:text="${curso.nombreCurso} + ' - ' + ${curso.horario}"></a>
            </li>
        </ul>
        <a class="salirini" th:href="@{/}">Salir</a>
    </div>
</body>
</html>
