# src/main/resources/application-local.properties

# Database Local (PostgreSQL en tu máquina)
spring.datasource.url=jdbc:postgresql://localhost:5432/siiga_db
spring.datasource.username=postgres
spring.datasource.password=tu_password_local

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Thymeleaf Cache (desactivar en desarrollo)
spring.thymeleaf.cache=false

# Logging para desarrollo
logging.level.com.uns.siiga2.__web=DEBUG
logging.level.org.springframework.web=DEBUG