services:
  - type: web
    name: siiga2.0
    env: java
    buildCommand: ./mvnw clean package
    startCommand: java -jar target/*.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: siiga-db
          property: connectionString
    autoDeploy: true

databases:
  - name: siiga-db
    databaseName: siiga
    user: siiga_user
    plan: free