# railway.toml - VERSIÓN DOCKERFILE
[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[deploy]
# IMPORTANTE: NO uses startCommand con Dockerfile, usa CMD en Dockerfile
# startCommand = ""  # Déjalo vacío o elimina esta línea

[database]

[healthcheck]
path = "/health"
timeout = "30s"
interval = "15s"
retries = 3

[restart]
policy = "on_failure"
max_retries = 3