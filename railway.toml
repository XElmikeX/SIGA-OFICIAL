# railway.toml
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "java -Dserver.port=$PORT -jar target/siiga2-web-*.jar"

[database]
# Esto creará automáticamente una base de datos PostgreSQL en Railway

[healthcheck]
path = "/actuator/health"
timeout = "30s"
interval = "30s"
retries = 3

[restart]
policy = "on_failure"
max_retries = 3