# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: siiga_postgres
    environment:
      POSTGRES_DB: siiga_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: siiga_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@siiga.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8085:8085"
    depends_on:
      - postgres

volumes:
  postgres_data:
