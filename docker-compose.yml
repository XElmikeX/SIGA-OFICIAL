version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: siiga-postgres-local
    environment:
      POSTGRES_DB: siiga_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - siiga-network-local

  app:
    build: .
    container_name: siiga-app-local
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: siiga_local
      PGUSER: postgres
      PGPASSWORD: postgres
      PORT: 8080
      # ¡ESTAS 2 SON NUEVAS! ↓
      SPRING_THYMELEAF_CACHE: "false"
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - siiga-network-local
    restart: unless-stopped
    # ¡ESTAS 3 SON NUEVAS! ↓
    volumes:
      - ./src/main/resources/static:/app/static
      - ./src/main/resources/templates:/app/templates

networks:
  siiga-network-local:
    driver: bridge

volumes:
  postgres_data: