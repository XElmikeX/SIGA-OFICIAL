<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Curso</title>
    <link rel="stylesheet" th:href="@{/info/css-admin/nvcurso.css}">
    <link rel="icon" th:href="@{/G-assets/imagenes/logo.png}">
</head>
<body>
    <!-- Botón Volver -->
    <a class="volver-btn" th:href="@{/horario-admin}">← Volver</a>
    
    <!-- Formulario -->
    <form th:action="@{/cursos/guardar}" method="post" id="formCurso" novalidate>
        <h1>Crear Nuevo Curso</h1>
        
        <div class="form-content">
            <!-- Nombre del Curso -->
            <div class="input-group">
                <label>
                    <input name="nombreCurso" class="form-input" type="text" placeholder=" " required>
                    <span class="floating-label">Nombre del Curso</span>
                </label>
            </div>
            
            <!-- Horario -->
            <div class="input-group">
                <label>
                    <input name="horario" class="form-input" type="text" placeholder=" " required>
                    <span class="floating-label">Horario</span>
                </label>
            </div>
            
            <!-- Docente -->
            <div class="input-group">
                <label>
                    <input name="docenteUsername" class="form-input" type="text" placeholder=" " required>
                    <span class="floating-label">Usuario del Docente</span>
                </label>
            </div>
            
            <!-- Botón -->
            <div class="btn-container">
                <button type="submit" class="submit-btn">Registrar</button>
            </div>
        </div>
        
        <!-- Mensajes -->
        <div class="message" id="mensaje"></div>
    </form>
    
    <script th:src="@{/js/crear-curso.js}"></script>
</body>
</html>
